safety:
  enabled: true
  state_timeout_s: 1.0
  command_timeout_s: 2.0
  max_joint_step_rad: 0.08
  joint_limit_margin_rad: 0.01
  reject_nan_or_inf: true

  workspace:
    minimum_m: [-0.70, -0.70, -0.10]
    maximum_m: [0.70, 0.70, 0.90]

  singularity:
    # Disabled by default until the score threshold is calibrated with B2.
    # The implementation and tests are present; enable after benchmark evidence.
    enabled: false
    minimum_score: 0.002
