config_version: 1

safety:
  enabled: true
  provenance: provisional_v0.2_source_urdf_limits
  max_trajectory_points: 1000
  max_workspace_resample_samples: 10000
  state_timeout_s: 1.0
  command_timeout_s: 2.0
  stop_timeout_s: 1.0
  max_joint_step_rad: 0.08
  max_joint_velocity_rad_s: [1.0, 1.0, 1.0, 1.5, 1.5, 1.5]
  max_joint_acceleration_rad_s2: [2.0, 2.0, 2.0, 3.0, 3.0, 3.0]
  joint_limit_margin_rad: 0.01

  workspace:
    minimum_m: [-0.70, -0.70, -0.10]
    maximum_m: [0.70, 0.70, 0.90]
    resample_step_rad: 0.04

  singularity:
    # Disabled until the threshold is calibrated on the certified arm.
    enabled: false
    minimum_score: 0.002
