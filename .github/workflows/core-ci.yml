name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python38:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: |
            pycore/pyproject.toml
            requirements/constraints-py38.txt
      - run: bash -n tools/*.sh
      - run: ./tools/bootstrap_core.sh
      - run: ./tools/test_all.sh
